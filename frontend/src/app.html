<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<link rel="stylesheet" href="/fonts/fonts.css" />
		<link rel="preload" href="/fonts/public-sans-400.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="preload" href="/fonts/jetbrains-mono-400.woff2" as="font" type="font/woff2" crossorigin />
		<script>
			// Apply the saved theme before first paint to avoid a flash
			try {
				const saved = JSON.parse(localStorage.getItem('swafcode:general-settings') || '{}');
				const theme = saved.theme === 'default' ? 'swaf' : saved.theme || 'swaf';
				document.documentElement.dataset.theme = theme;
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
